# Builds the Vite site and publishes dist/ to GitHub Pages on every push to main.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /solafi/
      # Design review: the new-look branch is published at /solafi/preview/ so it
      # can be shared without changing the live site. Remove these two steps when
      # the branch is merged or dropped.
      - uses: actions/checkout@v4
        with:
          ref: new-look
          path: preview-src
      - name: Build the design preview
        working-directory: preview-src
        run: |
          npm ci
          npm run build
          mv dist ../dist/preview
        env:
          VITE_BASE: /solafi/preview/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
